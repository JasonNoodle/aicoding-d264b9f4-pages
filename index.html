<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>华为工作天数计算器</title>
<style>
  :root {
    --hw-red: #C7000B;
    --hw-red-dark: #97000A;
    --ink: #1c1c1e;
    --muted: #6b6b70;
    --line: rgba(0, 0, 0, 0.08);
    --bg: #f4f4f6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(199, 0, 11, 0.10), transparent 60%),
      radial-gradient(700px 500px at 100% 110%, rgba(199, 0, 11, 0.07), transparent 60%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 22px;
    padding: 40px 36px 34px;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 12px 40px rgba(0, 0, 0, 0.10);
    border: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
  }

  .mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(145deg, var(--hw-red), var(--hw-red-dark));
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    flex: none;
  }

  .brand h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .brand p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field {
    position: relative;
  }

  input[type="date"] {
    width: 100%;
    padding: 15px 16px;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: #fbfbfc;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  input[type="date"]:hover { background: #fff; }

  input[type="date"]:focus {
    background: #fff;
    border-color: var(--hw-red);
    box-shadow: 0 0 0 4px rgba(199, 0, 11, 0.10);
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: pointer;
    opacity: 0.55;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 16px;
  }

  .hint.error { color: var(--hw-red); }

  .result {
    margin-top: 26px;
    border-radius: 16px;
    padding: 26px 24px 22px;
    background: linear-gradient(160deg, #fff6f6, #fdf0f0);
    border: 1px solid rgba(199, 0, 11, 0.12);
    text-align: center;
  }

  .result.empty {
    background: #fafafa;
    border: 1px dashed var(--line);
    border-style: dashed;
  }

  .result .cap {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .number {
    font-size: 56px;
    line-height: 1.1;
    font-weight: 700;
    color: var(--hw-red);
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
  }

  .number .unit {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0;
    margin-left: 6px;
  }

  .result.empty .number { color: #cfcfd4; font-size: 40px; }

  .breakdown {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid rgba(199, 0, 11, 0.12);
  }

  .breakdown > div { min-width: 62px; }

  .breakdown b {
    display: block;
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .breakdown span {
    font-size: 12px;
    color: var(--muted);
  }

  .extra {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.7;
    text-align: center;
  }

  .extra b { color: var(--ink); font-weight: 600; }

  .footnote {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: #9a9aa0;
    line-height: 1.7;
  }

  @media (max-width: 420px) {
    .card { padding: 30px 22px 26px; border-radius: 18px; }
    .number { font-size: 46px; }
    .breakdown { gap: 14px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark">HW</div>
      <div>
        <h1>华为工作天数计算器</h1>
        <p>输入入职日期，看看你与华为同行了多少天</p>
      </div>
    </div>

    <label for="joinDate">加入华为的日期</label>
    <div class="field">
      <input id="joinDate" type="date" />
    </div>
    <div class="hint" id="hint">请选择你的入职日期</div>

    <div class="result empty" id="result">
      <div class="cap">在华为工作的总天数</div>
      <div class="number" id="days">—</div>
    </div>

    <div class="extra" id="extra"></div>

    <div class="footnote">
      计算口径：从入职当天起算，到今日（含今日）为止的自然日天数。若入职日期晚于今天，将无法计算。
    </div>
  </main>

<script>
(function () {
  var input = document.getElementById('joinDate');
  var hint = document.getElementById('hint');
  var result = document.getElementById('result');
  var daysEl = document.getElementById('days');
  var extra = document.getElementById('extra');

  var DAY = 86400000;

  // 以 UTC 零点构造日期，规避时区与夏令时误差
  function toUTC(y, m, d) {
    var t = new Date(Date.UTC(y, m - 1, d));
    // 校验日期真实存在（如 2 月 30 日）
    if (t.getUTCFullYear() !== y || t.getUTCMonth() !== m - 1 || t.getUTCDate() !== d) {
      return null;
    }
    return t;
  }

  function todayUTC() {
    var n = new Date();
    return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
  }

  // 计算日历差值：X 年 Y 月 Z 天
  function calendarDiff(from, to) {
    var y = to.getUTCFullYear() - from.getUTCFullYear();
    var m = to.getUTCMonth() - from.getUTCMonth();
    var d = to.getUTCDate() - from.getUTCDate();
    if (d < 0) {
      m -= 1;
      // 上个月的天数
      var prevMonthLast = new Date(Date.UTC(to.getUTCFullYear(), to.getUTCMonth(), 0)).getUTCDate();
      d += prevMonthLast;
    }
    if (m < 0) {
      y -= 1;
      m += 12;
    }
    return { y: y, m: m, d: d };
  }

  function formatNum(n) {
    return n.toLocaleString('zh-CN');
  }

  function reset() {
    result.classList.add('empty');
    daysEl.textContent = '—';
    extra.innerHTML = '';
    var old = result.querySelector('.breakdown');
    if (old) old.remove();
  }

  function render() {
    var raw = input.value;
    if (!raw) {
      reset();
      hint.textContent = '请选择你的入职日期';
      hint.classList.remove('error');
      return;
    }

    var parts = raw.split('-');
    var join = toUTC(+parts[0], +parts[1], +parts[2]);
    var today = todayUTC();

    if (!join) {
      reset();
      hint.textContent = '日期无效，请重新选择';
      hint.classList.add('error');
      return;
    }

    if (join > today) {
      reset();
      hint.textContent = '入职日期不能晚于今天（' + formatDate(today) + '）';
      hint.classList.add('error');
      return;
    }

    hint.textContent = '入职日期：' + formatDate(join);
    hint.classList.remove('error');

    var total = Math.round((today - join) / DAY) + 1; // 含入职当天
    var diff = calendarDiff(join, today);

    result.classList.remove('empty');
    daysEl.innerHTML = formatNum(total) + '<span class="unit">天</span>';

    var rows = [
      { v: diff.y, u: '年' },
      { v: diff.m, u: '月' },
      { v: diff.d, u: '天' }
    ];
    var bd = document.createElement('div');
    bd.className = 'breakdown';
    bd.innerHTML = rows.map(function (r) {
      return '<div><b>' + r.v + '</b><span>' + r.u + '</span></div>';
    }).join('');
    // 描述：X年Y月Z天
    var desc = (diff.y > 0 ? diff.y + ' 年 ' : '') +
               (diff.y > 0 || diff.m > 0 ? diff.m + ' 个月 ' : '') +
               diff.d + ' 天';

    extra.innerHTML =
      '折算为 <b>' + desc + '</b><br>' +
      '<span style="opacity:.85">距下一个整百天还有 <b>' +
      (100 - (total % 100 === 0 ? 100 : total % 100)) + '</b> 天</span>';

    // 把 breakdown 插入到 result 内
    var old = result.querySelector('.breakdown');
    if (old) old.remove();
    result.appendChild(bd);
  }

  function formatDate(d) {
    var y = d.getUTCFullYear();
    var m = ('0' + (d.getUTCMonth() + 1)).slice(-2);
    var day = ('0' + d.getUTCDate()).slice(-2);
    return y + ' 年 ' + m + ' 月 ' + day + ' 日';
  }

  // 限制最大可选日期为今天
  var t = new Date();
  input.max = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);

  input.addEventListener('input', render);
  input.addEventListener('change', render);
})();
</script>
</body>
</html>
